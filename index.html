<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OVERHEAD — Live Airspace</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
  @import url('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css');

  :root {
    --bg: #0a0e0d;
    --panel: #101615;
    --line: #1e2827;
    --text: #e8ede9;
    --dim: #7a8985;
    --lime: #c8ff4d;
    --blue: #4dd2ff;
    --amber: #ffb84d;
    --danger: #ff5d5d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overscroll-behavior: none;
  }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    flex-shrink: 0;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 2px; margin: 0;
    color: var(--lime);
  }
  h1 span { color: var(--text); }
  .status {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--dim); text-align: right;
  }
  .status .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim); margin-right: 5px;
  }
  .status.live .dot { background: var(--lime); box-shadow: 0 0 6px var(--lime); }
  .status.err .dot { background: var(--danger); }

  .controls {
    display: flex; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0; flex-wrap: wrap; align-items: center;
    background: var(--panel);
  }
  .controls input[type="text"] {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px;
    padding: 8px 10px; border-radius: 6px; width: 90px;
  }
  .controls input[type="text"]::placeholder { color: var(--dim); }
  .controls label {
    font-size: 11px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.5px; margin-right: 4px;
  }
  .btn {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
  }
  .btn.primary { background: var(--lime); color: #08130a; border-color: var(--lime); font-weight: 700; }
  .btn:active { transform: scale(0.97); }
  .radius-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 140px; }
  input[type="range"] {
    flex: 1; accent-color: var(--lime); height: 4px;
  }
  .radius-val {
    font-family: 'DM Mono', monospace; color: var(--lime); font-size: 13px; width: 54px; text-align: right;
  }

  .radar-wrap {
    position: relative; flex-shrink: 0;
    display: flex; justify-content: center;
    padding: 14px 0 6px;
    background: radial-gradient(ellipse at center, #0d1413 0%, #090c0b 100%);
    border-bottom: 1px solid var(--line);
  }
  canvas { display: block; }

  .view-toggle {
    display: flex; gap: 4px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 3px;
  }
  .view-toggle button {
    background: transparent; border: none; color: var(--dim);
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .view-toggle button.active { background: var(--lime); color: #08130a; }

  .map-wrap {
    position: relative; flex-shrink: 0; height: 320px;
    border-bottom: 1px solid var(--line);
    display: none;
  }
  .map-wrap.visible { display: block; }
  #mapEl { width: 100%; height: 100%; background: var(--bg); }

  /* Dark-theme the Leaflet chrome to match the rest of the app */
  .leaflet-container { background: #0d1413; }
  .leaflet-control-zoom a {
    background: var(--panel) !important; color: var(--text) !important;
    border-color: var(--line) !important;
  }
  .leaflet-control-attribution {
    background: rgba(10,14,13,0.75) !important; color: var(--dim) !important;
  }
  .leaflet-control-attribution a { color: var(--blue) !important; }
  .plane-icon {
    color: var(--lime); font-size: 16px; line-height: 1;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
  .you-icon {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--blue); border: 2px solid #0a0e0d;
    box-shadow: 0 0 8px var(--blue);
  }

  .empty-note {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-family: 'DM Mono', monospace; font-size: 12px; color: var(--dim);
    text-align: center; pointer-events: none; width: 200px;
  }

  .list {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .row:active { background: var(--panel); }
  .row.pinned {
    background: rgba(200,255,77,0.06);
    border-left: 3px solid var(--lime);
    padding-left: 13px;
  }
  .pin-badge {
    font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
    color: #08130a; background: var(--lime);
    padding: 2px 6px; border-radius: 4px; margin-right: 2px;
    cursor: pointer;
  }
  .heading-chip {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--line); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--blue);
  }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .callsign {
    font-family: 'DM Mono', monospace; font-weight: 700; font-size: 14px;
    color: var(--text); letter-spacing: 0.5px;
  }
  .airline {
    font-size: 12px; color: var(--amber); font-weight: 500;
  }
  .sub {
    font-size: 11px; color: var(--dim); margin-top: 2px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .row-metrics { text-align: right; flex-shrink: 0; }
  .dist {
    font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 700; color: var(--lime);
  }
  .alt {
    font-size: 11px; color: var(--dim); margin-top: 2px;
    font-family: 'DM Mono', monospace;
  }
  .route-row {
    padding: 0 16px 12px 56px; margin-top: -8px;
    border-bottom: 1px solid var(--line);
    font-family: 'DM Mono', monospace; font-size: 12px; color: var(--blue);
    display: flex; align-items: center; gap: 8px;
  }
  .route-row .arrow { color: var(--dim); }
  .route-row .route-airline { color: var(--amber); font-weight: 600; margin-right: 4px; }
  .route-row.loading, .route-row.unknown { color: var(--dim); font-style: italic; }
  .tap-hint {
    font-size: 10px; color: var(--dim); margin-top: 2px; letter-spacing: 0.3px;
  }

  .footer-note {
    padding: 10px 16px; font-size: 11px; color: var(--dim);
    text-align: center; border-top: 1px solid var(--line);
    font-family: 'DM Mono', monospace; flex-shrink: 0;
  }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1>OVER<span>HEAD</span></h1>
    </div>
    <div class="status" id="status"><span class="dot"></span>connecting</div>
  </header>

  <div class="controls">
    <label>Lat</label>
    <input type="text" id="latInput" placeholder="42.33">
    <label>Lon</label>
    <input type="text" id="lonInput" placeholder="-83.90">
    <button class="btn" id="locBtn">📍 Use my location</button>
  </div>
  <div class="controls">
    <div class="radius-wrap">
      <label>Radius</label>
      <input type="range" id="radiusSlider" min="5" max="150" value="40" step="5">
      <span class="radius-val" id="radiusVal">40 mi</span>
    </div>
    <div class="view-toggle">
      <button id="radarViewBtn" class="active">Radar</button>
      <button id="mapViewBtn">Map</button>
    </div>
    <button class="btn primary" id="refreshBtn">Refresh</button>
  </div>

  <div class="radar-wrap" id="radarWrap">
    <canvas id="radar" width="320" height="320"></canvas>
    <div class="empty-note" id="emptyNote"></div>
  </div>
  <div class="map-wrap" id="mapWrap">
    <div id="mapEl"></div>
  </div>

  <div class="list" id="list"></div>

  <div class="footer-note" id="footerNote">Set your location to begin scanning</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const R_EARTH_MI = 3958.8;

// Common ICAO airline prefixes -> airline name (covers most US/major international carriers)
const AIRLINES = {
  AAL: 'American Airlines', UAL: 'United Airlines', DAL: 'Delta Air Lines', SWA: 'Southwest Airlines',
  JBU: 'JetBlue', ASA: 'Alaska Airlines', SKW: 'SkyWest', RPA: 'Republic Airways', ENY: 'Envoy Air',
  FFT: 'Frontier Airlines', NKS: 'Spirit Airlines', HAL: 'Hawaiian Airlines', AAY: 'Allegiant Air',
  EDV: 'Endeavor Air', GJS: 'GoJet Airlines', ASH: 'Mesa Airlines', PDT: 'Piedmont Airlines',
  QXE: 'Horizon Air', UPS: 'UPS Airlines', FDX: 'FedEx Express', GTI: 'Atlas Air',
  ACA: 'Air Canada', WJA: 'WestJet', POE: 'Porter Airlines',
  BAW: 'British Airways', VIR: 'Virgin Atlantic', EZY: 'easyJet', RYR: 'Ryanair', WZZ: 'Wizz Air',
  DLH: 'Lufthansa', AFR: 'Air France', KLM: 'KLM', IBE: 'Iberia', SWR: 'SWISS', AUA: 'Austrian Airlines',
  SAS: 'SAS Scandinavian', FIN: 'Finnair', TAP: 'TAP Air Portugal', LOT: 'LOT Polish Airlines',
  THY: 'Turkish Airlines', ETH: 'Ethiopian Airlines', MSR: 'EgyptAir', RAM: 'Royal Air Maroc',
  UAE: 'Emirates', QTR: 'Qatar Airways', ETD: 'Etihad Airways', SVA: 'Saudia', GFA: 'Gulf Air',
  CPA: 'Cathay Pacific', SIA: 'Singapore Airlines', ANA: 'All Nippon Airways', JAL: 'Japan Airlines',
  KAL: 'Korean Air', AAR: 'Asiana Airlines', CCA: 'Air China', CES: 'China Eastern', CSN: 'China Southern',
  EVA: 'EVA Air', CAL: 'China Airlines', THA: 'Thai Airways', MAS: 'Malaysia Airlines',
  GIA: 'Garuda Indonesia', PAL: 'Philippine Airlines', AIC: 'Air India', VTI: 'Vistara', IGO: 'IndiGo',
  QFA: 'Qantas', JST: 'Jetstar', ANZ: 'Air New Zealand', VOZ: 'Virgin Australia',
  LAN: 'LATAM Airlines', GLO: 'GOL Linhas Aereas', AZU: 'Azul Brazilian Airlines', ARG: 'Aerolineas Argentinas',
  AMX: 'Aeromexico', VOI: 'Volaris', AVA: 'Avianca', CMP: 'Copa Airlines',
};
function getAirlineName(callsign) {
  if (!callsign || callsign === '—') return null;
  const prefix = callsign.trim().slice(0, 3).toUpperCase();
  return AIRLINES[prefix] || null;
}

// Route (origin/destination) + airline lookup — fetched on demand per callsign to be polite to the API.
// adsbdb.com is a free, no-key, CORS-enabled community API built for exactly this callsign lookup.
const routeCache = new Map();
async function fetchRoute(callsign) {
  const key = callsign.trim();
  if (routeCache.has(key)) return routeCache.get(key);
  try {
    const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(key)}`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    const fr = data.response && data.response.flightroute;
    if (!fr) {
      routeCache.set(key, null);
      return null;
    }
    const route = {
      airline: fr.airline ? fr.airline.name : null,
      from: fr.origin ? `${fr.origin.icao_code} · ${fr.origin.municipality || fr.origin.name}` : null,
      to: fr.destination ? `${fr.destination.icao_code} · ${fr.destination.municipality || fr.destination.name}` : null,
    };
    routeCache.set(key, route);
    return route;
  } catch (err) {
    routeCache.set(key, null);
    return null;
  }
}

let state = {
  lat: null,
  lon: null,
  radiusMi: 40,
  flights: [],
  lastFetch: null,
  sweepAngle: 0,
  refreshTimer: null,
  viewMode: 'radar', // 'radar' | 'map'
  pinnedIcao: null,
};

let leafletMap = null;
let leafletUserMarker = null;
let leafletRadiusCircle = null;
let leafletPlaneMarkers = new Map(); // icao -> marker

function initMap() {
  if (leafletMap) return;
  leafletMap = L.map('mapEl', {
    zoomControl: true,
    attributionControl: true,
  }).setView([42.33, -83.90], 9);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19,
  }).addTo(leafletMap);
}

function updateMap() {
  if (!leafletMap || state.lat === null) return;

  // user position + radius circle
  if (!leafletUserMarker) {
    leafletUserMarker = L.marker([state.lat, state.lon], {
      icon: L.divIcon({ className: '', html: '<div class="you-icon"></div>', iconSize: [12, 12] }),
    }).addTo(leafletMap);
    leafletMap.setView([state.lat, state.lon], 9);
  } else {
    leafletUserMarker.setLatLng([state.lat, state.lon]);
  }

  const radiusMeters = state.radiusMi * 1609.34;
  if (!leafletRadiusCircle) {
    leafletRadiusCircle = L.circle([state.lat, state.lon], {
      radius: radiusMeters, color: '#c8ff4d', weight: 1, fillOpacity: 0.04, opacity: 0.35,
    }).addTo(leafletMap);
  } else {
    leafletRadiusCircle.setLatLng([state.lat, state.lon]);
    leafletRadiusCircle.setRadius(radiusMeters);
  }

  // aircraft markers — keep by icao so they don't flicker between refreshes
  const seen = new Set();
  state.flights.forEach(f => {
    seen.add(f.icao);
    const html = `<div class="plane-icon" style="transform: rotate(${f.heading}deg)">✈</div>`;
    if (leafletPlaneMarkers.has(f.icao)) {
      const m = leafletPlaneMarkers.get(f.icao);
      m.setLatLng([f.lat, f.lon]);
      m.setIcon(L.divIcon({ className: '', html, iconSize: [18, 18] }));
      m.setTooltipContent(tooltipFor(f));
    } else {
      const m = L.marker([f.lat, f.lon], {
        icon: L.divIcon({ className: '', html, iconSize: [18, 18] }),
      }).addTo(leafletMap).bindTooltip(tooltipFor(f), { direction: 'top', offset: [0, -6] });
      m.on('click', () => pinFlight(f.icao));
      leafletPlaneMarkers.set(f.icao, m);
    }
  });
  // remove markers for aircraft no longer in range
  for (const [icao, marker] of leafletPlaneMarkers.entries()) {
    if (!seen.has(icao)) {
      leafletMap.removeLayer(marker);
      leafletPlaneMarkers.delete(icao);
    }
  }
}

function tooltipFor(f) {
  const altStr = f.altitudeFt !== null ? f.altitudeFt.toLocaleString() + ' ft' : '';
  const airlineStr = f.airline ? f.airline + ' · ' : '';
  return `${f.callsign} — ${airlineStr}${altStr}`;
}

function pinFlight(icao) {
  state.pinnedIcao = icao;
  renderList();
  els.list.scrollTop = 0;
}

function setViewMode(mode) {
  state.viewMode = mode;
  els.radarViewBtn.classList.toggle('active', mode === 'radar');
  els.mapViewBtn.classList.toggle('active', mode === 'map');
  els.radarWrap.style.display = mode === 'radar' ? 'flex' : 'none';
  els.mapWrap.classList.toggle('visible', mode === 'map');

  if (mode === 'map') {
    initMap();
    // Leaflet needs a size recalculation after its container becomes visible
    setTimeout(() => {
      leafletMap.invalidateSize();
      updateMap();
    }, 50);
  }
}

const els = {
  status: document.getElementById('status'),
  latInput: document.getElementById('latInput'),
  lonInput: document.getElementById('lonInput'),
  locBtn: document.getElementById('locBtn'),
  radiusSlider: document.getElementById('radiusSlider'),
  radiusVal: document.getElementById('radiusVal'),
  refreshBtn: document.getElementById('refreshBtn'),
  canvas: document.getElementById('radar'),
  emptyNote: document.getElementById('emptyNote'),
  list: document.getElementById('list'),
  footerNote: document.getElementById('footerNote'),
  radarWrap: document.getElementById('radarWrap'),
  mapWrap: document.getElementById('mapWrap'),
  radarViewBtn: document.getElementById('radarViewBtn'),
  mapViewBtn: document.getElementById('mapViewBtn'),
};

const ctx = els.canvas.getContext('2d');

function setStatus(mode, text) {
  els.status.className = 'status ' + mode;
  els.status.innerHTML = '<span class="dot"></span>' + text;
}

function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function haversineMi(lat1, lon1, lat2, lon2) {
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R_EARTH_MI * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function boundingBox(lat, lon, radiusMi) {
  const latDelta = radiusMi / 69.0;
  const lonDelta = radiusMi / (69.0 * Math.cos(toRad(lat)) || 1);
  return {
    lamin: lat - latDelta, lamax: lat + latDelta,
    lomin: lon - lonDelta, lomax: lon + lonDelta,
  };
}

async function fetchFlights() {
  if (state.lat === null || state.lon === null) return;
  setStatus('', 'scanning…');

  // airplanes.live: free, no-key ADS-B API built for exactly this point+radius query.
  // Radius param is nautical miles; we convert from the mi the UI works in.
  const radiusNm = Math.min(state.radiusMi * 0.868976, 250).toFixed(2);
  const url = `https://api.airplanes.live/v2/point/${state.lat}/${state.lon}/${radiusNm}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' from airplanes.live');
    const data = await res.json();
    const raw = data.ac || data.aircraft || [];

    const flights = raw
      .filter(a => typeof a.lat === 'number' && typeof a.lon === 'number' && a.alt_baro !== 'ground')
      .map(a => {
        const lat = a.lat, lon = a.lon;
        const dist = haversineMi(state.lat, state.lon, lat, lon);
        const callsign = (a.flight || '').trim() || '—';
        const heading = typeof a.track === 'number' ? Math.round(a.track)
          : (typeof a.mag_heading === 'number' ? Math.round(a.mag_heading) : 0);
        const vertRate = typeof a.baro_rate === 'number' ? a.baro_rate
          : (typeof a.geom_rate === 'number' ? a.geom_rate : 0);
        return {
          icao: a.hex,
          callsign,
          airline: getAirlineName(callsign),
          country: null,
          lon, lat,
          altitudeFt: typeof a.alt_baro === 'number' ? Math.round(a.alt_baro) : null,
          velocityMph: typeof a.gs === 'number' ? Math.round(a.gs * 1.15078) : null,
          heading,
          vertRate,
          distMi: dist,
          brg: bearing(state.lat, state.lon, lat, lon),
        };
      })
      .filter(f => f.distMi <= state.radiusMi)
      .sort((a, b) => a.distMi - b.distMi);

    state.flights = flights;
    state.lastFetch = new Date();
    setStatus('live', flights.length + ' aircraft');
    els.footerNote.textContent = 'Last updated ' + state.lastFetch.toLocaleTimeString() + ' · auto-refresh every 20s';
    render();
  } catch (err) {
    setStatus('err', 'connection error');
    // Surface the real cause instead of a generic message — CORS failures, offline,
    // and HTTP errors all look different here and matter for debugging.
    const reason = (err && err.message) ? err.message : 'unknown error';
    els.footerNote.textContent = `Could not reach airplanes.live (${reason}) — will retry automatically`;
    console.error('Flight fetch failed:', err);
  }
}

function drawRadar() {
  const w = els.canvas.width, h = els.canvas.height;
  const cx = w/2, cy = h/2, maxR = w/2 - 24;

  ctx.clearRect(0, 0, w, h);

  // range rings
  ctx.strokeStyle = 'rgba(200,255,77,0.12)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, maxR * i / 3, 0, Math.PI*2);
    ctx.stroke();
  }
  // crosshairs
  ctx.beginPath();
  ctx.moveTo(cx - maxR, cy); ctx.lineTo(cx + maxR, cy);
  ctx.moveTo(cx, cy - maxR); ctx.lineTo(cx, cy + maxR);
  ctx.stroke();

  // ring labels
  ctx.fillStyle = 'rgba(122,137,133,0.7)';
  ctx.font = '10px DM Mono, monospace';
  for (let i = 1; i <= 3; i++) {
    const val = Math.round(state.radiusMi * i / 3);
    ctx.fillText(val + 'mi', cx + 4, cy - (maxR * i / 3) + 10);
  }

  // sweep
  const grad = ctx.createConicGradient ?
    (() => {
      const g = ctx.createConicGradient(toRad(state.sweepAngle - 90), cx, cy);
      g.addColorStop(0, 'rgba(200,255,77,0.35)');
      g.addColorStop(0.08, 'rgba(200,255,77,0)');
      g.addColorStop(1, 'rgba(200,255,77,0)');
      return g;
    })() : null;
  if (grad) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, maxR, 0, Math.PI*2);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // center marker (you)
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI*2);
  ctx.fillStyle = '#4dd2ff';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 7, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(77,210,255,0.5)';
  ctx.stroke();

  // aircraft blips
  state.flights.forEach(f => {
    const r = (f.distMi / state.radiusMi) * maxR;
    const angle = toRad(f.brg - 90);
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(toRad(f.heading));
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(4, 5);
    ctx.lineTo(0, 2);
    ctx.lineTo(-4, 5);
    ctx.closePath();
    ctx.fillStyle = '#c8ff4d';
    ctx.fill();
    ctx.restore();
  });

  els.emptyNote.textContent = state.flights.length === 0 && state.lat !== null
    ? 'No aircraft detected in range' : '';
}

function renderList() {
  if (state.flights.length === 0) {
    els.list.innerHTML = '';
    return;
  }

  // Pinned flight (tapped on the map) floats to the top, rest stays distance-sorted.
  let ordered = state.flights;
  if (state.pinnedIcao) {
    const pinned = state.flights.find(f => f.icao === state.pinnedIcao);
    if (pinned) {
      ordered = [pinned, ...state.flights.filter(f => f.icao !== state.pinnedIcao)];
    } else {
      state.pinnedIcao = null; // flight left range
    }
  }

  els.list.innerHTML = ordered.map((f, i) => {
    const altStr = f.altitudeFt !== null ? f.altitudeFt.toLocaleString() + ' ft' : 'alt —';
    const spdStr = f.velocityMph !== null ? f.velocityMph + ' mph' : '';
    const vArrow = f.vertRate > 1 ? '↑' : f.vertRate < -1 ? '↓' : '';
    const airlineStr = f.airline ? `<span class="airline">${f.airline}</span>` : '';
    const canLookupRoute = f.callsign && f.callsign !== '—';
    const isPinned = f.icao === state.pinnedIcao;
    return `
      <div class="row ${isPinned ? 'pinned' : ''}" data-idx="${i}" data-icao="${f.icao}" data-callsign="${f.callsign}" ${canLookupRoute ? 'style="cursor:pointer"' : ''}>
        <div class="heading-chip" style="transform: rotate(${f.heading}deg)">↑</div>
        <div class="row-main">
          <div class="row-top">
            ${isPinned ? '<span class="pin-badge">FROM MAP ✕</span>' : ''}
            <span class="callsign">${f.callsign}</span>
            ${airlineStr}
          </div>
          <div class="sub"><span>${f.country || ''}</span><span>${spdStr}</span><span>${vArrow}</span></div>
          ${canLookupRoute ? '<div class="tap-hint">tap for route</div>' : ''}
        </div>
        <div class="row-metrics">
          <div class="dist">${f.distMi.toFixed(1)} mi</div>
          <div class="alt">${altStr}</div>
        </div>
      </div>
      <div class="route-slot" data-slot="${i}"></div>
    `;
  }).join('');

  els.list.querySelectorAll('.row[data-callsign]').forEach(row => {
    row.addEventListener('click', (evt) => {
      const isPinClear = evt.target.closest('.pin-badge');
      if (isPinClear) {
        state.pinnedIcao = null;
        renderList();
        return;
      }
      const idx = row.getAttribute('data-idx');
      const callsign = row.getAttribute('data-callsign');
      expandRoute(idx, callsign);
    });
  });

  // If a flight was just pinned from the map, auto-expand its route info
  if (state.pinnedIcao) {
    const pinnedFlight = ordered[0];
    if (pinnedFlight && pinnedFlight.callsign !== '—') {
      expandRoute('0', pinnedFlight.callsign);
    }
  }
}

async function expandRoute(idx, callsign) {
  const slot = els.list.querySelector(`.route-slot[data-slot="${idx}"]`);
  if (!slot || !callsign || callsign === '—') return;

  // toggle: if already showing, clear it (unless it was just auto-opened for a fresh pin)
  if (slot.dataset.shown === 'true') {
    slot.innerHTML = '';
    slot.dataset.shown = 'false';
    return;
  }

  slot.innerHTML = '<div class="route-row loading">looking up route…</div>';
  slot.dataset.shown = 'true';
  const route = await fetchRoute(callsign);
  if (route && (route.from || route.to)) {
    const airlineBit = route.airline ? `<span class="route-airline">${route.airline}</span>` : '';
    slot.innerHTML = `<div class="route-row">${airlineBit}<span>${route.from || '?'}</span><span class="arrow">→</span><span>${route.to || '?'}</span></div>`;
  } else {
    slot.innerHTML = '<div class="route-row unknown">no route on file for this callsign</div>';
  }
}

function render() {
  drawRadar();
  renderList();
  if (state.viewMode === 'map') updateMap();
  if (state.lastFetch) {
    els.footerNote.textContent = 'Last updated ' + state.lastFetch.toLocaleTimeString() + ' · auto-refresh every 20s';
  }
}

function sweepLoop() {
  state.sweepAngle = (state.sweepAngle + 2) % 360;
  drawRadar();
  requestAnimationFrame(sweepLoop);
}
requestAnimationFrame(sweepLoop);

function scheduleRefresh() {
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  state.refreshTimer = setInterval(fetchFlights, 20000);
}

els.locBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    setStatus('err', 'no geolocation support');
    return;
  }
  setStatus('', 'locating…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;
      els.latInput.value = state.lat.toFixed(4);
      els.lonInput.value = state.lon.toFixed(4);
      fetchFlights();
      scheduleRefresh();
    },
    err => {
      setStatus('err', 'location denied — enter manually');
    },
    { enableHighAccuracy: false, timeout: 8000 }
  );
});

function applyManualLocation() {
  const lat = parseFloat(els.latInput.value);
  const lon = parseFloat(els.lonInput.value);
  if (isNaN(lat) || isNaN(lon)) return;
  state.lat = lat;
  state.lon = lon;
  fetchFlights();
  scheduleRefresh();
}

els.latInput.addEventListener('change', applyManualLocation);
els.lonInput.addEventListener('change', applyManualLocation);

els.radiusSlider.addEventListener('input', () => {
  state.radiusMi = parseInt(els.radiusSlider.value, 10);
  els.radiusVal.textContent = state.radiusMi + ' mi';
  drawRadar();
});
els.radiusSlider.addEventListener('change', fetchFlights);

els.refreshBtn.addEventListener('click', fetchFlights);

els.radarViewBtn.addEventListener('click', () => setViewMode('radar'));
els.mapViewBtn.addEventListener('click', () => setViewMode('map'));

// initial render
drawRadar();
</script>
</body>
</html>
